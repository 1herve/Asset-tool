[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-database-audit-tool"
version = "0.1.0"
description = "Audit local des 98 variables INVREF : exhaustivité et conformité"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
asset-audit = "asset_audit.__main__:main"

[tool.setuptools.package-data]
asset_audit = ["invref.json"]

[tool.setuptools.packages.find]
include = ["asset_audit*"]
